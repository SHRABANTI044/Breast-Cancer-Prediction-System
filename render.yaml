services:
  - type: web
    name: breast-cancer-prediction-system
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: breastcare-db
          property: connectionString
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"

databases:
  - name: breastcare-db
    databaseName: breastcare
    user: breastcare
    plan: basic-256mb
    region: singapore
